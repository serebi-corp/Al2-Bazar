<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al2 Bazar - Catálogo Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            bazar: {
              50: '#fff5f7',
              100: '#ffe4e9',
              200: '#fecdd6',
              300: '#fea3b4',
              400: '#fc708d',
              500: '#f43f68',
              600: '#e11d4d',
              700: '#be123c',
            }
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-bazar-50 text-stone-800 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-white/95 backdrop-blur sticky top-0 z-40 border-b border-bazar-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-bazar-600">Al2 Bazar</h1>
        <p class="text-xs text-stone-500 font-medium">Catálogo & Pedidos por WhatsApp</p>
      </div>
      
      <!-- Botón Carrito -->
      <button onclick="toggleCart(true)" class="relative flex items-center gap-2 bg-bazar-500 hover:bg-bazar-600 text-white px-4 py-2 rounded-full font-semibold shadow-sm transition">
        <span>🛒 Mi Pedido</span>
        <span id="cartBadge" class="bg-white text-bazar-600 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </button>
    </div>
  </header>

  <!-- Filtros -->
  <section class="max-w-6xl mx-auto px-4 pt-5 pb-2 w-full">
    <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
      <div class="relative w-full sm:w-96">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Buscar producto..." 
          class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-bazar-200 bg-white focus:outline-none focus:ring-2 focus:ring-bazar-400 text-sm shadow-sm"
          oninput="filtrarProductos()"
        >
        <span class="absolute left-3.5 top-2.5 text-bazar-400">🔍</span>
      </div>

      <div class="flex gap-2 w-full sm:w-auto items-center justify-between sm:justify-end">
        <label class="inline-flex items-center cursor-pointer bg-white px-3 py-2 rounded-xl border border-bazar-200 text-xs font-semibold text-stone-600 select-none">
          <input type="checkbox" id="stockOnly" class="sr-only peer" onchange="filtrarProductos()">
          <div class="w-8 h-4 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-stone-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-bazar-500 relative mr-2"></div>
          Solo con Stock
        </label>

        <select id="sortSelect" onchange="filtrarProductos()" class="bg-white border border-bazar-200 rounded-xl px-3 py-2 text-xs font-semibold text-stone-600 focus:outline-none focus:ring-2 focus:ring-bazar-300">
          <option value="default">Orden original</option>
          <option value="price-asc">Menor precio</option>
          <option value="price-desc">Mayor precio</option>
          <option value="alpha">A - Z</option>
        </select>
      </div>
    </div>

    <!-- Categorías -->
    <div id="categoryContainer" class="flex gap-2 overflow-x-auto py-3 no-scrollbar text-xs font-medium"></div>
  </section>

  <!-- Grilla de Productos -->
  <main class="max-w-6xl mx-auto px-4 pb-12 flex-1 w-full">
    <div id="statusMessage" class="text-center py-16 text-stone-500 text-sm">
      Cargando catálogo e imágenes...
    </div>
    
    <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-4 hidden"></div>

    <div id="countDisplay" class="text-center text-xs text-stone-400 mt-6 hidden"></div>
  </main>

  <!-- Modal Zoom de Imagen (Lightbox) -->
  <div id="zoomModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="cerrarZoom(event)">
    <div class="relative max-w-4xl max-h-[90vh] flex flex-col items-center justify-center" onclick="event.stopPropagation()">
      <button onclick="cerrarZoom()" class="absolute -top-10 right-0 text-white hover:text-bazar-300 text-3xl font-bold leading-none p-1">&times;</button>
      
      <!-- Imagen ampliada -->
      <img id="zoomImg" src="" alt="Zoom Producto" class="max-w-full max-h-[75vh] object-contain rounded-2xl shadow-2xl bg-white/5 select-none">
      
      <!-- Controles de navegación en zoom -->
      <div id="zoomControls" class="flex items-center justify-between w-full mt-3 px-2">
        <button onclick="cambiarFotoZoom(-1)" class="bg-white/20 hover:bg-white/40 text-white px-3 py-1.5 rounded-full font-bold text-sm backdrop-blur transition flex items-center gap-1">
          ‹ Anterior
        </button>
        <span id="zoomCounter" class="text-white text-xs bg-black/50 px-3 py-1 rounded-full font-semibold">1/1</span>
        <button onclick="cambiarFotoZoom(1)" class="bg-white/20 hover:bg-white/40 text-white px-3 py-1.5 rounded-full font-bold text-sm backdrop-blur transition flex items-center gap-1">
          Siguiente ›
        </button>
      </div>
      <p id="zoomTitle" class="text-white/90 text-sm font-semibold text-center mt-2 px-4 line-clamp-1"></p>
    </div>
  </div>

  <!-- Carrito Lateral -->
  <div id="cartModal" class="fixed inset-0 z-50 overflow-hidden hidden">
    <div class="absolute inset-0 bg-stone-900/40 backdrop-blur-sm transition-opacity" onclick="toggleCart(false)"></div>
    <div class="fixed inset-y-0 right-0 max-w-full flex">
      <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
        <div class="p-4 border-b border-stone-100 flex items-center justify-between bg-bazar-50">
          <h2 class="text-lg font-bold text-stone-800 flex items-center gap-2">🛒 Tu Pedido</h2>
          <button onclick="toggleCart(false)" class="text-stone-400 hover:text-stone-600 text-2xl leading-none">&times;</button>
        </div>

        <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

        <div class="p-4 border-t border-stone-100 bg-stone-50 space-y-3">
          <div class="flex justify-between items-center text-base font-bold text-stone-800">
            <span>Total:</span>
            <span id="cartTotal" class="text-bazar-600 text-xl">$0</span>
          </div>

          <div class="space-y-2">
            <input type="text" id="clientName" placeholder="Tu nombre y apellido" class="w-full px-3 py-2 rounded-lg border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-bazar-300">
            <select id="deliveryMethod" class="w-full px-3 py-2 rounded-lg border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-bazar-300">
              <option value="Retiro en local">Retiro en local</option>
              <option value="Envío a domicilio">Envío a domicilio</option>
            </select>
          </div>

          <button onclick="enviarWhatsApp()" class="w-full bg-[#25D366] hover:bg-[#20ba59] text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-sm transition">
            Enviar Pedido a WhatsApp
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby_kibEnyrDJtfXOe195P1njvrA4PVmZFxqSrOJ9NRQnFxhKsA0HRDOM0_PmOqMEYcN/exec";
    const WHATSAPP_PHONE = "5491124529009";

    let allProducts = [];
    let activeCategory = 'Todas';
    let cart = [];
    let currentPhotoIndices = {};
    let currentZoomProduct = null;

    async function cargarCatalogo() {
      const status = document.getElementById('statusMessage');
      const grid = document.getElementById('productsGrid');

      try {
        const res = await fetch(APPS_SCRIPT_URL);
        allProducts = await res.json();
        
        status.classList.add('hidden');
        grid.classList.remove('hidden');
        document.getElementById('countDisplay').classList.remove('hidden');

        construirCategorias();
        filtrarProductos();
      } catch (err) {
        status.innerHTML = `<p class="text-rose-500 font-semibold mb-2">Error cargando el catálogo.</p>`;
      }
    }

    function construirCategorias() {
      const container = document.getElementById('categoryContainer');
      const categorias = ['Todas', ...new Set(allProducts.map(p => p.categoria).filter(Boolean))];

      container.innerHTML = categorias.map(cat => `
        <button 
          onclick="setCategory('${cat}')" 
          class="cat-btn px-4 py-1.5 rounded-full border transition whitespace-nowrap ${cat === 'Todas' ? 'bg-bazar-500 text-white border-bazar-500 font-semibold' : 'bg-white text-stone-600 border-bazar-200 hover:border-bazar-400'}"
          data-cat="${cat}"
        >
          ${cat}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if(btn.dataset.cat === cat) {
          btn.className = 'cat-btn px-4 py-1.5 rounded-full border transition whitespace-nowrap bg-bazar-500 text-white border-bazar-500 font-semibold';
        } else {
          btn.className = 'cat-btn px-4 py-1.5 rounded-full border transition whitespace-nowrap bg-white text-stone-600 border-bazar-200 hover:border-bazar-400';
        }
      });
      filtrarProductos();
    }

    function filtrarProductos() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const onlyStock = document.getElementById('stockOnly').checked;
      const sort = document.getElementById('sortSelect').value;

      let filtered = allProducts.filter(p => {
        const matchesQuery = p.nombre.toLowerCase().includes(q) || p.categoria.toLowerCase().includes(q);
        const matchesCat = activeCategory === 'Todas' || p.categoria === activeCategory;
        const matchesStock = !onlyStock || p.stock;
        return matchesQuery && matchesCat && matchesStock;
      });

      if (sort === 'price-asc') filtered.sort((a,b) => a.precio - b.precio);
      if (sort === 'price-desc') filtered.sort((a,b) => b.precio - a.precio);
      if (sort === 'alpha') filtered.sort((a,b) => a.nombre.localeCompare(b.nombre));

      renderGrid(filtered);
    }

    function renderGrid(products) {
      const grid = document.getElementById('productsGrid');
      const count = document.getElementById('countDisplay');
      count.textContent = `Mostrando ${products.length} productos`;

      if (products.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-stone-400">No se encontraron productos.</div>`;
        return;
      }

      grid.innerHTML = products.map(p => {
        const fotos = p.fotos && p.fotos.length > 0 ? p.fotos : [];
        if (!(p.id in currentPhotoIndices)) currentPhotoIndices[p.id] = 0;
        const curIdx = currentPhotoIndices[p.id];
        const currentImg = fotos.length > 0 ? fotos[curIdx] : null;

        return `
          <div class="bg-white rounded-2xl p-3 border border-bazar-100 flex flex-col justify-between shadow-sm hover:shadow-md transition">
            <div>
              <div class="relative w-full h-44 bg-bazar-50 rounded-xl overflow-hidden mb-3 flex items-center justify-center group">
                ${currentImg ? `
                  <img id="img-${p.id}" src="${currentImg}" alt="${p.nombre}" class="w-full h-full object-contain p-2 cursor-pointer transition-transform duration-200 group-hover:scale-105" loading="lazy" onclick="abrirZoom(${p.id})">
                  
                  <!-- Icono de lupa indicador de zoom -->
                  <button onclick="abrirZoom(${p.id})" title="Ver en grande" class="absolute top-2 right-2 bg-white/80 hover:bg-white text-stone-700 w-7 h-7 rounded-full flex items-center justify-center shadow text-xs backdrop-blur opacity-80 sm:opacity-0 group-hover:opacity-100 transition">
                    🔍
                  </button>

                  ${fotos.length > 1 ? `
                    <button onclick="cambiarFoto(event, ${p.id}, -1)" class="absolute left-1 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-stone-700 w-6 h-6 rounded-full flex items-center justify-center shadow text-xs font-bold">‹</button>
                    <button onclick="cambiarFoto(event, ${p.id}, 1)" class="absolute right-1 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-stone-700 w-6 h-6 rounded-full flex items-center justify-center shadow text-xs font-bold">›</button>
                    <span id="dots-${p.id}" class="absolute bottom-1 bg-black/40 text-white text-[10px] px-2 py-0.5 rounded-full select-none">${curIdx + 1}/${fotos.length}</span>
                  ` : ''}
                ` : `
                  <div class="flex flex-col items-center justify-center text-bazar-300">
                    <span class="text-3xl">🌸</span>
                    <span class="text-[10px] text-stone-400 mt-1">Al2 Bazar</span>
                  </div>
                `}
              </div>

              <div class="flex items-center justify-between mb-1.5">
                <span class="text-[10px] font-bold uppercase tracking-wider text-bazar-500 bg-bazar-50 px-2 py-0.5 rounded-md line-clamp-1 max-w-[65%]">
                  ${p.categoria}
                </span>
                <span class="text-[11px] font-semibold ${p.stock ? 'text-emerald-600' : 'text-stone-400'}">
                  ${p.stock ? '● En Stock' : '○ Sin Stock'}
                </span>
              </div>
              <h3 class="font-semibold text-stone-800 text-xs leading-snug line-clamp-2" title="${p.nombre}">${p.nombre}</h3>
            </div>

            <div class="mt-3 pt-3 border-t border-stone-100 flex items-center justify-between">
              <span class="text-sm font-bold text-stone-900">$${p.precio.toLocaleString('es-AR')}</span>
              <button 
                onclick="addToCart(${p.id})" 
                ${!p.stock ? 'disabled' : ''}
                class="text-xs font-semibold px-3 py-1.5 rounded-lg transition ${p.stock ? 'bg-bazar-500 text-white hover:bg-bazar-600' : 'bg-stone-100 text-stone-400 cursor-not-allowed'}"
              >
                ${p.stock ? '+ Agregar' : 'Agotado'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function cambiarFoto(event, id, delta) {
      if (event) event.stopPropagation();
      const prod = allProducts.find(p => p.id === id);
      if (!prod || !prod.fotos || prod.fotos.length <= 1) return;

      let idx = currentPhotoIndices[id] + delta;
      if (idx < 0) idx = prod.fotos.length - 1;
      if (idx >= prod.fotos.length) idx = 0;
      
      currentPhotoIndices[id] = idx;
      const imgEl = document.getElementById(`img-${id}`);
      const dotsEl = document.getElementById(`dots-${id}`);
      
      if (imgEl) imgEl.src = prod.fotos[idx];
      if (dotsEl) dotsEl.textContent = `${idx + 1}/${prod.fotos.length}`;
    }

    // Funciones del Modal de Zoom (Lightbox)
    function abrirZoom(id) {
      const prod = allProducts.find(p => p.id === id);
      if (!prod || !prod.fotos || prod.fotos.length === 0) return;

      currentZoomProduct = prod;
      actualizarVistaZoom();
      document.getElementById('zoomModal').classList.remove('hidden');
    }

    function cerrarZoom(event) {
      if (event && event.target.id !== 'zoomModal' && event.target.tagName !== 'BUTTON') return;
      document.getElementById('zoomModal').classList.add('hidden');
      currentZoomProduct = null;
    }

    function actualizarVistaZoom() {
      if (!currentZoomProduct) return;
      const curIdx = currentPhotoIndices[currentZoomProduct.id] || 0;
      const zoomImg = document.getElementById('zoomImg');
      const zoomCounter = document.getElementById('zoomCounter');
      const zoomControls = document.getElementById('zoomControls');
      const zoomTitle = document.getElementById('zoomTitle');

      zoomImg.src = currentZoomProduct.fotos[curIdx];
      zoomTitle.textContent = currentZoomProduct.nombre;

      if (currentZoomProduct.fotos.length > 1) {
        zoomControls.classList.remove('hidden');
        zoomCounter.textContent = `${curIdx + 1} / ${currentZoomProduct.fotos.length}`;
      } else {
        zoomControls.classList.add('hidden');
      }
    }

    function cambiarFotoZoom(delta) {
      if (!currentZoomProduct) return;
      cambiarFoto(null, currentZoomProduct.id, delta);
      actualizarVistaZoom();
    }

    // Cerrar con Escape o mover con teclas de flecha
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.getElementById('zoomModal').classList.add('hidden');
        toggleCart(false);
      }
      if (!document.getElementById('zoomModal').classList.contains('hidden') && currentZoomProduct) {
        if (e.key === 'ArrowLeft') cambiarFotoZoom(-1);
        if (e.key === 'ArrowRight') cambiarFotoZoom(1);
      }
    });

    // Lógica del Carrito
    function addToCart(id) {
      const product = allProducts.find(p => p.id === id);
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      actualizarCarrito();
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
      actualizarCarrito();
    }

    function actualizarCarrito() {
      const badge = document.getElementById('cartBadge');
      const list = document.getElementById('cartItems');
      const totalEl = document.getElementById('cartTotal');

      const totalItems = cart.reduce((acc, i) => acc + i.qty, 0);
      const totalPrice = cart.reduce((acc, i) => acc + (i.precio * i.qty), 0);

      badge.textContent = totalItems;
      totalEl.textContent = `$${totalPrice.toLocaleString('es-AR')}`;

      if (cart.length === 0) {
        list.innerHTML = `<div class="text-center py-12 text-stone-400 text-sm">Tu pedido está vacío.</div>`;
        return;
      }

      list.innerHTML = cart.map(item => `
        <div class="flex items-center justify-between bg-stone-50 p-2.5 rounded-xl border border-stone-100">
          <div class="flex-1 pr-2">
            <p class="text-xs font-semibold text-stone-800 line-clamp-1">${item.nombre}</p>
            <p class="text-xs text-bazar-600 font-bold">$${(item.precio * item.qty).toLocaleString('es-AR')}</p>
          </div>
          <div class="flex items-center gap-1.5 bg-white border border-stone-200 rounded-lg px-2 py-0.5">
            <button onclick="changeQty(${item.id}, -1)" class="text-stone-500 font-bold text-sm px-1">-</button>
            <span class="text-xs font-semibold w-4 text-center">${item.qty}</span>
            <button onclick="changeQty(${item.id}, 1)" class="text-stone-500 font-bold text-sm px-1">+</button>
          </div>
        </div>
      `).join('');
    }

    function toggleCart(show) {
      document.getElementById('cartModal').classList.toggle('hidden', !show);
    }

    function enviarWhatsApp() {
      if (cart.length === 0) {
        alert('Agregá al menos un producto al pedido.');
        return;
      }
      const nombre = document.getElementById('clientName').value.trim() || 'No especificado';
      const entrega = document.getElementById('deliveryMethod').value;
      const total = cart.reduce((acc, i) => acc + (i.precio * i.qty), 0);

      let msg = `¡Hola *Al2 Bazar*! Quiero hacer el siguiente pedido:\n\n`;
      cart.forEach(item => {
        msg += `▪ ${item.qty}x ${item.nombre} ($${(item.precio * item.qty).toLocaleString('es-AR')})\n`;
      });
      msg += `\n*Total:* $${total.toLocaleString('es-AR')}`;
      msg += `\n*Cliente:* ${nombre}`;
      msg += `\n*Entrega:* ${entrega}`;

      window.open(`https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    cargarCatalogo();
  </script>
</body>
</html>
